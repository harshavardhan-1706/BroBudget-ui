<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savings Goals | BroBudget</title><link rel="stylesheet" href="css/dashboard.css"></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">₹</div><div><b>Bro<span style="color:#67e8f9">Budget</span></b><small>Smart finance workspace</small></div></div>
<div class="nav-title">Workspace</div><nav class="nav"><a href="index.html" data-page="index.html"><span>⌂</span>Dashboard</a><a href="income.html" data-page="income.html"><span>↗</span>Income</a><a href="expenses.html" data-page="expenses.html"><span>↘</span>Expenses</a><a href="analytics.html" data-page="analytics.html"><span>◔</span>Analytics</a><a href="goals.html" data-page="goals.html"><span>◎</span>Savings Goals</a><a href="history.html" data-page="history.html"><span>▦</span>Monthly History</a><a href="transactions.html" data-page="transactions.html"><span>↔</span>Transactions</a><a href="settings.html" data-page="settings.html"><span>⚙</span>Settings</a></nav><div class="user-card"><div class="avatar">BB</div><div><strong id="sidebarUser">BroBudget User</strong><small>Personal finance</small></div></div></aside>
<main class="main"><header class="topbar"><div class="page-title"><h1>Savings Goals</h1><p>Elegant money management with clear insights.</p></div><div class="actions"><button class="btn mobile-toggle" id="mobileToggle">☰</button><button class="btn primary" data-open-modal>＋ Add transaction</button></div></header>
<section class="container">
<div class="grid three" id="goalGrid"></div>
<div class="card" style="margin-top:16px"><div class="section-head"><h2>Create savings goal</h2><a class="btn" href="index.html">← Dashboard</a></div><form id="goalForm" class="form-grid"><div class="field"><label>Goal name</label><input id="goalName" required placeholder="New laptop"></div><div class="field"><label>Target amount</label><input id="goalTarget" type="number" min="1" required placeholder="80000"></div><div class="field"><label>Already saved</label><input id="goalSaved" type="number" min="0" value="0"></div><div class="field"><label>&nbsp;</label><button class="btn primary">Create goal</button></div></form></div>
</section></main></div>
<div class="modal" id="txModal"><div class="modal-box"><div class="modal-head"><h2>Add transaction</h2><button class="btn" data-close-modal>×</button></div><form id="txForm" class="form-grid">
<div class="field"><label>Name</label><input name="name" required placeholder="e.g. Grocery shopping"></div><div class="field"><label>Amount</label><input name="amount" type="number" min="1" required></div>
<div class="field"><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
<div class="field"><label>Category</label><select name="category"><option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Salary</option><option>Freelance</option><option>Other</option></select></div>
<div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Note</label><input name="note" placeholder="Optional note"></div>
<div class="field full"><button class="btn primary">Save transaction</button></div></form></div></div><div id="toast" class="toast"></div>
<script src="js/app.js"></script><script>
function renderGoals(){const b=document.getElementById("goalGrid");b.innerHTML=BB.goals.map(g=>{const p=Math.min(100,Math.round(g.saved/g.target*100));return `<div class="card goal"><div class="goal-top"><span class="goal-name">${esc(g.name)}</span><span>${p}%</span></div><div class="progress"><span style="width:${p}%"></span></div><div class="goal-top"><span class="muted">${money(g.saved)} saved</span><span class="muted">of ${money(g.target)}</span></div><button class="btn danger delete-goal" data-id="${g.id}">Delete</button></div>`}).join("")||'<div class="card empty">No savings goals yet.</div>';document.querySelectorAll(".delete-goal").forEach(b=>b.onclick=()=>{BB.goals=BB.goals.filter(g=>g.id!=b.dataset.id);renderGoals();toast("Goal deleted")})}
document.addEventListener("DOMContentLoaded",()=>{renderGoals();document.getElementById("goalForm").onsubmit=e=>{e.preventDefault();BB.goals=[...BB.goals,{id:Date.now(),name:goalName.value,target:+goalTarget.value,saved:+goalSaved.value||0}];e.target.reset();goalSaved.value=0;renderGoals();toast("Goal created")}})
</script></body></html>
